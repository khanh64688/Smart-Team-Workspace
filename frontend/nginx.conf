# Cấu hình nginx cho bản build production của frontend.
# Chỉ dùng ở tầng `runtime` khi deploy; chạy local bằng compose dùng vite dev server.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # File có hash trong tên -> cache lâu, an toàn.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: mọi đường dẫn không khớp file thật đều trả index.html,
    # nếu không thì F5 ở /projects/123 sẽ ra 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
