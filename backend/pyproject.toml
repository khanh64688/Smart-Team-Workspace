# Cấu hình pytest cho backend.
# Cấu hình ruff nằm ở ruff.toml tại gốc repo (để lint được cả seed_data.py).

[tool.pytest.ini_options]
testpaths = ["tests"]
# Cho phép `from app...` mà không cần cài package hay chỉnh sys.path thủ công.
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: test chạm CSDL hoặc nhiều tầng, chậm hơn unit test",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/__init__.py",
    "alembic/*",
    "tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
