# Để "PR đỏ thì không merge" có hiệu lực, bật một lần trên GitHub:
# Settings > Branches > Add branch ruleset > áp cho develop và main
# > Require status checks to pass > chọn "CI passed".
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, 'feature/**']

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Cài dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Test (pytest)
        # Mã 5 = chưa có test nào, không nên làm đỏ PR ở giai đoạn đầu dự án.
        run: pytest --cov=app --cov-report=term-missing || [ $? -eq 5 ]

  frontend:
    name: Frontend - lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # always() để job vẫn chạy khi có job hỏng — GitHub coi skipped là đạt.
    if: always()

    steps:
      - name: Chặn merge nếu có job đỏ
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::CI đỏ, PR này không được merge."
            exit 1
          fi
