name: CI

# =============================================================
#  Chạy tự động với MỌI Pull Request vào develop (và main).
#  Ba việc kiểm tra: ruff (lint backend) · pytest (test backend) · build frontend.
#
#  Job cuối `ci-passed` gom kết quả ba job trên thành MỘT trạng thái duy nhất.
#  Đặt đúng job này làm "required status check" trong Branch protection của
#  GitHub thì PR đỏ sẽ bị chặn merge. Xem .github/BRANCH_PROTECTION.md.
# =============================================================

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  # Cho phép bấm chạy tay từ tab Actions khi cần.
  workflow_dispatch:

# Push thêm commit vào PR thì huỷ lần chạy cũ, chỉ giữ lần mới nhất.
# Tiết kiệm phút Actions và tránh đọc nhầm kết quả cũ.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # -----------------------------------------------------------
  #  1. Lint backend bằng ruff
  # -----------------------------------------------------------
  backend-lint:
    name: Lint backend (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Chỉ cài ruff, không cài cả requirements — lint không cần fastapi.
      # Bộ rule đã liệt kê tường minh trong ruff.toml nên bản ruff mới
      # không tự bật thêm rule làm CI đỏ bất ngờ.
      - name: Cài ruff
        run: pip install ruff

      - name: ruff check
        # --output-format=github để lỗi hiện ngay trên tab Files changed của PR.
        run: ruff check --output-format=github .

      # Kiểm tra định dạng chỉ cảnh báo, chưa chặn merge — tránh đỏ hàng loạt
      # với code đã viết trước khi có CI. Muốn bắt buộc thì bỏ dòng
      # `continue-on-error` bên dưới.
      - name: ruff format (kiểm tra định dạng)
        continue-on-error: true
        run: ruff format --check --diff .

  # -----------------------------------------------------------
  #  2. Test backend bằng pytest
  # -----------------------------------------------------------
  backend-test:
    name: Test backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # PostgreSQL sẵn sàng cho integration test. Test hiện dùng SQLite
      # in-memory nên chưa cần, nhưng có sẵn thì không phải sửa CI về sau.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stw
          POSTGRES_PASSWORD: stw
          POSTGRES_DB: stw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stw -d stw_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Cài dependency
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Chạy migration Alembic (nếu đã có)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://stw:stw@localhost:5432/stw_test
        run: |
          if [ -f alembic.ini ]; then
            alembic upgrade head
          else
            echo "::notice title=Chưa có Alembic::Bỏ qua migration vì backend/alembic.ini chưa tồn tại."
          fi

      - name: Chạy pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://stw:stw@localhost:5432/stw_test
          SECRET_KEY: ci-secret-key-khong-dung-that
        run: |
          set +e
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml
          exit_code=$?
          set -e

          # pytest trả mã 5 khi không tìm thấy test nào. Giai đoạn đầu dự án
          # điều đó là bình thường, không nên làm đỏ PR của người khác.
          # Khi backend/tests/ đã có test, mã 5 sẽ không còn xuất hiện.
          if [ "$exit_code" -eq 5 ]; then
            echo "::warning title=Chưa có test::pytest không tìm thấy test nào trong backend/tests/. Job vẫn xanh, nhưng cần bổ sung test trước khi đóng Sprint."
            exit 0
          fi

          exit $exit_code

      - name: Lưu báo cáo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  # -----------------------------------------------------------
  #  3. Build frontend
  # -----------------------------------------------------------
  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      # Nhánh nào chưa có frontend/ thì job vẫn xanh thay vì chặn merge.
      # Không dùng bộ lọc `paths:` ở phần `on:` vì khi đó GitHub sẽ để trạng
      # thái "pending" mãi mãi và PR không bao giờ merge được.
      - name: Kiểm tra frontend đã tồn tại chưa
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Chưa có frontend::Không tìm thấy frontend/package.json nên bỏ qua bước build."
          fi

      - name: Cài Node ${{ env.NODE_VERSION }}
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài dependency
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        # `npm ci` cài đúng theo package-lock.json. Nếu chưa có lockfile thì
        # lùi về `npm install` để job không chết vì lý do hạ tầng.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning title=Thiếu package-lock.json::Nên commit lockfile để mọi người cài đúng cùng một bộ dependency."
            npm install
          fi

      - name: Lint
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000
        run: npm run build

      - name: Lưu kết quả build
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: ignore
          retention-days: 7

  # -----------------------------------------------------------
  #  4. Kiểm tra file Docker
  # -----------------------------------------------------------
  docker-check:
    name: Kiểm tra cấu hình Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      # Bắt lỗi cú pháp YAML và biến môi trường thiếu, trước khi cả nhóm
      # tải về rồi mới phát hiện `docker compose up` không chạy.
      - name: docker compose config
        run: docker compose config -q

      - name: Build thử ảnh backend
        run: docker build --target dev -t stw-backend:ci ./backend

      - name: Build thử ảnh frontend
        run: |
          if [ -f frontend/package.json ]; then
            docker build --target dev -t stw-frontend:ci ./frontend
          else
            echo "::warning title=Chưa có frontend::Bỏ qua build ảnh frontend."
          fi

  # -----------------------------------------------------------
  #  5. Cổng chặn merge — ĐÂY là job cần đặt làm required status check
  # -----------------------------------------------------------
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-build, docker-check]
    # `always()` để job này vẫn chạy khi có job phía trên hỏng — nhờ vậy nó
    # báo đỏ thay vì bị bỏ qua (skipped, GitHub tính là đạt).
    if: always()

    steps:
      - name: Tổng hợp kết quả
        run: |
          echo "Lint backend    : ${{ needs.backend-lint.result }}"
          echo "Test backend    : ${{ needs.backend-test.result }}"
          echo "Build frontend  : ${{ needs.frontend-build.result }}"
          echo "Kiểm tra Docker : ${{ needs.docker-check.result }}"

          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error title=CI đỏ::Có job không đạt. Theo quy ước trong README, PR này không được merge."
            exit 1
          fi

          echo "Tất cả job đều đạt."
