line-length = 100
target-version = "py312"

exclude = ["frontend", "backend/alembic/versions"]

[lint]
select = ["E", "F", "I", "UP", "B", "C4"]
# B008: FastAPI bắt buộc viết `db: Session = Depends(get_db)`.
ignore = ["B008", "E501"]

[lint.per-file-ignores]
"backend/tests/*" = ["E402"]
"backend/app/scripts/*" = ["E402"]
"**/__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["app"]
