services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-twl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-twlpass}
      POSTGRES_DB: ${POSTGRES_DB:-smart_team_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-twl} -d ${POSTGRES_DB:-smart_team_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      # vi cái này mò mãi mới ra :v
      # - DATABASE_URL=postgresql://${POSTGRES_USER:-twl}:${POSTGRES_PASSWORD:-twlpass}@db:5432/${POSTGRES_DB:-smart_team_db}
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-twl}:${POSTGRES_PASSWORD:-twlpass}@db:5432/${POSTGRES_DB:-smart_team_db}
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_me_in_production}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: